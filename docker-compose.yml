services:
  app:
    build: .
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=sqlite:///./app.db
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
      - YANDEX_DEFAULT_MODEL=${YANDEX_DEFAULT_MODEL}
      - COMETAPI_KEY=${COMETAPI_KEY}
      - COMETAPI_BASE_URL=${COMETAPI_BASE_URL:-https://api.cometapi.com}
      - COMETAPI_DEFAULT_IMAGE_MODEL=${COMETAPI_DEFAULT_IMAGE_MODEL:-gemini-3.1-flash-image-preview}
      - COMETAPI_TIMEOUT_SECONDS=${COMETAPI_TIMEOUT_SECONDS:-180}
      - COMETAPI_IMAGE_MAX_PRICE=${COMETAPI_IMAGE_MAX_PRICE:-0.3}
      - IMAGE_TTL_SECONDS=${IMAGE_TTL_SECONDS:-900}
      - IMAGE_QUEUE_MAXSIZE=${IMAGE_QUEUE_MAXSIZE:-50}
      - IMAGE_MAX_STORED=${IMAGE_MAX_STORED:-50}
      - IMAGE_CATALOG_TTL_SECONDS=${IMAGE_CATALOG_TTL_SECONDS:-600}
      - YANDEX_IMAGE_MODEL=${YANDEX_IMAGE_MODEL:-aliceai-image-art-3.0}
      - YANDEX_IMAGE_MODELS=${YANDEX_IMAGE_MODELS:-aliceai-image-art-3.0}
      - YANDEX_IMAGE_PRICE_USD=${YANDEX_IMAGE_PRICE_USD:-0.01}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    restart: unless-stopped
