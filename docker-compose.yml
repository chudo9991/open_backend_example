services:
  app:
    build: .
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=sqlite:///./app.db
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
      - YANDEX_DEFAULT_MODEL=${YANDEX_DEFAULT_MODEL}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    restart: unless-stopped
